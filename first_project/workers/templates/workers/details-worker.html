{% extends 'main/base.html' %}
{% load static %}

{% block title %} Worker info {% endblock %}

{% block content %}
    <h1>Information</h1>
    <p>Name: {{ worker.name }}</p>
    <p>Salary: {{ worker.salary }}</p>
    {% if worker.note %}
        <p>{{ worker.note }}</p>
    {% else %}
        <p>extra information doesn't exist</p>
    {% endif %}

    <a href="{%  url 'all_workers' %}" style="color: green;">back</a>

{% endblock %}
