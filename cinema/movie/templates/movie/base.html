
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Cinema App{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col min-h-screen">

    <nav class="bg-gray-900 text-white p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="{% url 'movie_list' %}" class="text-xl font-bold">🎬 Cinema</a>
            <a href="{% url 'movie_add' %}" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm transition">+ Add Movie</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 flex-grow w-full">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 text-gray-400 text-center py-4 text-sm mt-auto">
        &copy; Cinema Project
    </footer>

</body>
</html>
