{% extends 'movie/base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-sm border text-center">
    <h1 class="text-xl font-bold mb-4">Delete "{{ object.title }}"?</h1>
    <p class="text-gray-600 mb-6">Are you sure you want to remove this movie?</p>
    <form method="post" class="flex gap-4 justify-center">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 text-white px-5 py-2 rounded-lg hover:bg-red-700">Delete</button>
        <a href="{% url 'movie_list' %}" class="bg-gray-200 text-gray-800 px-5 py-2 rounded-lg">Cancel</a>
    </form>
</div>
{% endblock %}
