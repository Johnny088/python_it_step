{% extends 'post/base.html' %}

{% block title %}Create Post{% endblock %}

{% block content %}
<header class="flex justify-between items-center mb-6 pb-4 border-b border-gray-200">
    <h1 class="text-2xl font-bold text-gray-800">Create New Post</h1>
    <a href="{% url 'index' %}" class="bg-gray-500 hover:bg-gray-600 text-white text-sm font-medium py-2 px-4 rounded-lg transition-colors">
        Back
    </a>
</header>

<form method="POST" class="space-y-4">
    {% csrf_token %}
    <div>
        {{ form.as_p }}
    </div>
    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors">
        Publish
    </button>
</form>
{% endblock %}
